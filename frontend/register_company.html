<!DOCTYPE html>
<html>

<head>

    <title>Company Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="container mt-5">

    <h2>Company Registration</h2>

    <div class="mb-3">
        <label>Company Name</label>
        <input type="text" id="company_name" class="form-control">
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control">
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" id="password" class="form-control">
    </div>

    <div class="mb-3">
        <label>Industry</label>
        <input type="text" id="industry" class="form-control">
    </div>

    <div class="mb-3">
        <label>Location</label>
        <input type="text" id="location" class="form-control">
    </div>

    <div class="mb-3">
        <label>Website</label>
        <input type="text" id="website" class="form-control">
    </div>

    <div class="mb-3">
        <label>HR Name</label>
        <input type="text" id="hr_name" class="form-control">
    </div>

    <div class="mb-3">
        <label>HR Email</label>
        <input type="email" id="hr_email" class="form-control">
    </div>

    <button
        class="btn btn-primary"
        onclick="registerCompany()"
    >
        Register
    </button>

<script>

async function registerCompany(){

    const response = await fetch(
        "http://127.0.0.1:5000/register/company",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                company_name: document.getElementById("company_name").value,

                email: document.getElementById("email").value,

                password: document.getElementById("password").value,

                industry: document.getElementById("industry").value,

                location: document.getElementById("location").value,

                website: document.getElementById("website").value,

                hr_name: document.getElementById("hr_name").value,

                hr_email: document.getElementById("hr_email").value
            })
        }
    )

    const data = await response.json()

    alert(data.message)

    window.location.href = "login.html"
}

</script>

</body>
</html>
