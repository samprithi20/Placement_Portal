<!DOCTYPE html>
<html>

<head>

    <title>Student Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="container mt-5">

    <h2>Student Registration</h2>

    <div class="mb-3">
        <label>Full Name</label>
        <input type="text" id="full_name" class="form-control">
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" id="email" class="form-control">
    </div>

    <div class="mb-3">
        <label>Password</label>
        <input type="password" id="password" class="form-control">
    </div>

    <div class="mb-3">
        <label>Department</label>
        <input type="text" id="department" class="form-control">
    </div>

    <div class="mb-3">
        <label>CGPA</label>
        <input type="number" step="0.1" id="cgpa" class="form-control">
    </div>

    <div class="mb-3">
        <label>Graduation Year</label>
        <input type="number" id="graduation_year" class="form-control">
    </div>

    <div class="mb-3">
        <label>Skills</label>
        <input type="text" id="skills" class="form-control">
    </div>

    <button
        class="btn btn-primary"
        onclick="registerStudent()"
    >
        Register
    </button>

<script>

async function registerStudent(){

    const response = await fetch(
        "http://127.0.0.1:5000/register/student",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                full_name: document.getElementById("full_name").value,

                email: document.getElementById("email").value,

                password: document.getElementById("password").value,

                department: document.getElementById("department").value,

                cgpa: document.getElementById("cgpa").value,

                graduation_year: document.getElementById("graduation_year").value,

                skills: document.getElementById("skills").value
            })
        }
    )

    const data = await response.json()

    alert(data.message)

    window.location.href = "login.html"
}

</script>

</body>
</html>
