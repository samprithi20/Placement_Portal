<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="container mt-5">

    <h2>Admin Dashboard</h2>

    <div id="dashboard"></div>

    <h3 class="mt-4">Pending Companies</h3>

<div id="pendingCompanies"></div>

<script>

async function loadDashboard(){

    const token = localStorage.getItem("token")

    const response = await fetch(
        "http://127.0.0.1:5000/admin/dashboard",
        {
            headers: {
                "Authorization": "Bearer " + token
            }
        }
    )

    const data = await response.json()

    document.getElementById("dashboard").innerHTML = `
    
        <div class="card p-3">

            <h5>Total Students: ${data.total_students}</h5>

            <h5>Total Companies: ${data.total_companies}</h5>

            <h5>Total Jobs: ${data.total_jobs}</h5>

            <h5>Pending Companies: ${data.pending_companies}</h5>

        </div>
    `
}

loadDashboard()

async function loadPendingCompanies(){

    const token = localStorage.getItem("token")

    const response = await fetch(
        "http://127.0.0.1:5000/admin/pending-companies",
        {
            headers: {
                "Authorization": "Bearer " + token
            }
        }
    )

    const companies = await response.json()

    let output = ""

    companies.forEach(company => {

        output += `
        
            <div class="card p-3 mt-2">

                <h5>${company.company_name}</h5>

                <p>Industry: ${company.industry}</p>

                <p>HR: ${company.hr_name}</p>

                <button
                    class="btn btn-success"
                    onclick="approveCompany(${company.id})"
                >
                    Approve
                </button>

            </div>
        `
    })

    document.getElementById("pendingCompanies").innerHTML = output
}

async function approveCompany(companyId){

    const token = localStorage.getItem("token")

    const response = await fetch(
        `http://127.0.0.1:5000/admin/approve-company/${companyId}`,
        {
            method: "PUT",

            headers: {
                "Authorization": "Bearer " + token
            }
        }
    )

    const data = await response.json()

    alert(data.message)

    loadPendingCompanies()

    loadDashboard()
}

loadPendingCompanies()

</script>

</body>
</html>
